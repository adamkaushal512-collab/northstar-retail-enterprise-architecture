openapi: 3.0.3
info:
  title: NorthStar Retail Inventory Reservation API
  version: 1.0.0
  description: |
    Internal OMS-to-Reservation-Service API.
    Inventory allocation is enforced atomically by the service.
servers:
  - url: https://reservation.internal.example
    description: Illustrative internal service endpoint

security:
  - oauth2ClientCredentials:
      - reservations.write

paths:
  /v1/reservations:
    post:
      operationId: createReservation
      summary: Create an inventory reservation
      description: |
        Atomically reserve inventory. Repeating an equivalent request
        with the same idempotency key must not allocate inventory twice.
        Reusing a key with a different request payload is a conflict.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable identifier for a logical reservation request.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReservationRequest'
      responses:
        '201':
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '200':
          description: Previously successful reservation returned for an idempotent replay
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    oauth2ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.example/oauth2/token
          scopes:
            reservations.write: Create inventory reservations

  schemas:
    CreateReservationRequest:
      type: object
      additionalProperties: false
      required:
        - orderId
        - storeId
        - sku
        - quantity
      properties:
        orderId:
          type: string
          minLength: 1
        storeId:
          type: string
          minLength: 1
        sku:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1

    Reservation:
      type: object
      required:
        - reservationId
        - orderId
        - status
        - quantity
      properties:
        reservationId:
          type: string
        orderId:
          type: string
        status:
          type: string
          enum: [RESERVED]
        quantity:
          type: integer
          minimum: 1

    ApiError:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - retryable
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            correlationId:
              type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Caller lacks required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: Insufficient inventory or idempotency-key conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Service temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
